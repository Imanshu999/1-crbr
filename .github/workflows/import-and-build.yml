name: Build Auralis Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-and-build.yml"
      - ".branding/overlay/**"

permissions:
  contents: write

concurrency:
  group: import-and-build
  cancel-in-progress: false

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream source (preserve custom branding and workflow)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/justshivv/Opentune.git /tmp/opentune
          rsync -a --exclude='.git' --exclude='.github/workflows/***' /tmp/opentune/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import OpenTune source with GPL-3.0 notices"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Apply Auralis branding overlay
        shell: bash
        run: |
          set -euo pipefail
          cp -a .branding/overlay/. ./

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint Android app
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Upload Auralis debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-Android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
